# horizontal: the custom_spine_5000 tree with the root at the start of the span;
# expect HT4-154 (L2/inv1 net), HT4-156 (5 vs 4 inverters), HT4-158 (L2/inv2)
# 6 stub(s) x 991.667 um
spine_spec:
  name: h_6stub
  type: spine
  units: um
  point: center
  root_net: net

  constraints:
    max_drive_length: 1020
    count_stub_in_drive: true

  placement:
    level_pitch: 2.88            # Y step between levels
    deviation: 10

  spine:
    orientation: horizontal
    span: 6000                  # total X covered by the stubs

  stubs:
    gap: 10
    tap: center

  levels:
    L1:
      cells:
        inv1: {input: net}
        inv2: {input: L1/inv1/Y}
        inv3: {input: L1/inv2/Y}
    L2:
      cells:
        inv1: {input: L1/inv1/Y}
        inv2: {input: L1/inv3/Y}
    L3:
      cells:
        inv1: {input: L1/inv3/Y}
        inv2: {input: L2/inv1/Y}
        inv3: {input: L2/inv1/Y}
    L4:
      cells:
        inv1: {input: L3/inv1/Y, output: stub1}
        inv2: {input: L3/inv1/Y, output: stub2}
        inv3: {input: L3/inv2/Y, output: stub3}
        inv4: {input: L3/inv2/Y, output: stub4}
        inv5: {input: L3/inv3/Y, output: stub5}
        inv6: {input: L3/inv3/Y, output: stub6}
