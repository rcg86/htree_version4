# horizontal: root drives the one leaf; expect no warnings
# 1 stub(s) x 1000.000 um
spine_spec:
  name: h_1stub
  type: spine
  units: um
  point: center
  root_net: net

  constraints:
    max_drive_length: 1020
    count_stub_in_drive: true

  placement:
    level_pitch: 2.88            # Y step between levels
    deviation: 10

  spine:
    orientation: horizontal
    span: 1000                  # total X covered by the stubs

  stubs:
    gap: 10
    tap: center

  levels:
    L1:
      cells:
        inv1: {input: net}
    L2:
      cells:
        inv1: {input: L1/inv1/Y, output: stub1}

