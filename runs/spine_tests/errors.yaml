# span 20 cannot hold 4 stubs with gap 10
# 4 stub(s) x -2.500 um
spine_spec:
  name: e_no_fit
  type: spine
  units: um
  point: center
  root_net: net

  constraints:
    max_drive_length: 1020
    count_stub_in_drive: true

  placement:
    level_pitch: 2.88            # Y step between levels
    deviation: 10

  spine:
    orientation: horizontal
    span: 20                  # total X covered by the stubs

  stubs:
    gap: 10
    tap: center

  levels:
    L1:
      cells:
        inv1: {input: net}
    L2:
      cells:
        inv1: {input: L1/inv1/Y}
    L3:
      cells:
        inv1: {input: L2/inv1/Y}
    L4:
      cells:
        inv1: {input: L3/inv1/Y}
        inv2: {input: L3/inv1/Y}
    L5:
      cells:
        inv1: {input: L4/inv1/Y, output: stub1}
        inv2: {input: L4/inv1/Y, output: stub2}
        inv3: {input: L4/inv2/Y, output: stub3}
        inv4: {input: L4/inv2/Y, output: stub4}

