# L1/inv2 and L2/inv1 drive each other
# 1 stub(s) x 1000.000 um
spine_spec:
  name: e_loop
  type: spine
  units: um
  point: center
  root_net: net

  constraints:
    max_drive_length: 1020
    count_stub_in_drive: true

  placement:
    level_pitch: 2.88            # X step between levels
    deviation: 10

  spine:
    orientation: vertical
    span: 1000                  # total Y covered by the stubs

  stubs:
    gap: 10
    tap: center

  levels:
    L1:
      cells:
        inv1: {input: net}
        inv2: {input: L2/inv1/Y}
    L2:
      cells:
        inv1: {input: L1/inv2/Y}
        inv2: {input: L1/inv1/Y, output: stub1}

