# Track grid
horizontal_layer_track: 0.72      # horizontal track pitch (um)
vertical_layer_track: 0.72        # vertical track pitch (um)
horizontal_track_offset: 0.36
vertical_track_offset: 0.36
horizontal_layer_width: 0.72      # horizontal track pitch (um)
vertical_layer_width: 0.72        # vertical track pitch (um)
# Occupancy
adjacent_track: 2                # tracks to leave clear each side of a used segment
group_move: 4
end_end_spacing: 1.0             # min gap between collinear segments on same track (um)

# Distance / skew
driver_distance: 1020             # max routed length per driver hop (um)
max_skew: 10                     # max source->sink length spread (um)

# Components / export
buffer_cell: INV12M3Mx2Fx7Dx_D96_N_S7P94TSL_C60L04

# Physical geometry of buffer_cell, in microns, relative to the cell origin.
# bbox/pin_A/pin_Y arrays are [llx, lly, urx, ury]. Pin bboxes are always
# fully contained within the cell bbox.
buffer_cell_geometry:
  INV12M3Mx2Fx7Dx_D96_N_S7P94TSL_C60L04:
    bbox:  [0.0,   0.0,   3.12,  1.778]
    pin_A: [2.523, 0.348, 2.933, 1.444]   # input pin
    pin_Y: [0.977, 1.019, 1.423, 1.524]   # output pin

buffer_cell_input: A
buffer_cell_output: Y
def_layer_horizontal: IA
def_layer_vertical: IB
ground_name: VSS
shield_addition_signal_length: 30.0   # um; legs longer than this are not shielded

# Geometry: source right edge, sinks left edge
source_point: [5485, 13486]
